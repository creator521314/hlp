[package]
name = "hlp"
version = "0.3.0"
edition = "2021"
description = "自然语言 → shell 命令翻译器：意图进，命令出，附逐段解释"
license = "MIT"
authors = ["creator521314"]

[dependencies]
# CLI 解析：多 flag + 变长位置参数 + 自动用法说明，手写解析错误处理成本高于成熟依赖
clap = "4"
# 配置文件反序列化
serde = { version = "1", features = ["derive"] }
# ollama API 与 LLM 输出解析
serde_json = "1"
# config.toml 解析
toml = "0.8"
# XDG 配置目录解析（手写无法正确处理 XDG_CONFIG_HOME 覆盖）
dirs = "5"
# 阻塞式 HTTP 客户端：不拖 tokio 运行时，保进程冷启动 < 20ms（设计决策 1）
ureq = { version = "2", features = ["json"] }
# 危险命令规则匹配：8 条规则含词边界/管道上下文/alternation，手写分词器复杂度与收益
# 不成比例（v0.2 设计决策 1）；编译耗时 < 1ms，不伤 --check 的 10ms 预算
regex = "1"
# 缓存 DB：bundled 静态编译 SQLite，避免目标机缺 libsqlite3 / 版本漂移（v0.3 决策 9）
rusqlite = { version = "0.31", features = ["bundled"] }
# daemon 拉起互斥：flock 防并发双拉起（v0.3 §2.3）；std 无 flock，不为此引 nix
fs2 = "0.4"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
